<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>Xrepot | Mantenimiento</title>
    <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/style.css?v=2" />
  </head>
  <body>
    <main class="maintenance-shell" id="site-content" aria-live="polite">
      <header class="site-header"><span class="brand">XREPOT</span><aside id="ad-banner" class="ad-banner" aria-label="Publicidad" hidden></aside></header>
      <div class="orb orb-one"></div><div class="orb orb-two"></div>
      <section class="hero">
        <p class="eyebrow"><span class="pulse"></span> Estado del servicio</p>
        <h1 id="headline">Estamos mejorando<br /><em>Xrepot.</em></h1>
        <p class="lead" id="lead-text">Realizamos mantenimiento para construir una experiencia más rápida y confiable. Pronto tendremos novedades para ti.</p>
        <div class="status-card"><span class="status-dot"></span><span id="status-text">Mantenimiento en curso</span></div>
      </section>
      <section class="announcements" id="announcements-section" hidden>
        <div class="section-heading"><p class="eyebrow">Actualizaciones</p><h2>Últimos anuncios</h2></div>
        <div id="announcements-list" class="announcement-list"></div>
      </section>
      <footer>© <span id="year"></span> Xrepot</footer>
    </main>
    <script src="/assets/public.js?v=2" defer></script>
  </body>
</html>
